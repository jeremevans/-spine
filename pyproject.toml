[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spline-equivalence"
version = "0.1.0"
description = "Reproducible not-a-knot tensor spline equivalence evidence"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2"]
license = {text = "MIT"}

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]
