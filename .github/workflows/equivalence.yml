name: Spline equivalence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-octave-r:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install numerical runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave r-base-core r-cran-pracma r-cran-jsonlite
          python -m pip install -r requirements-tested.txt
      - name: Unit tests and cross-engine evidence
        run: |
          python -m unittest discover -s tests -v
          python scripts/verify.py --require Octave R
          python scripts/verify_methods.py --require Octave R
          python examples/volatility_surface.py --results results
          python examples/compare_methods.py --output results/method-comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-octave-r-evidence
          path: results/
          if-no-files-found: error

  actual-matlab:
    # Automatic licensing is documented for public projects.
    # Private projects: configure MathWorks licensing before enabling this job.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tested.txt
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - name: Export actual MATLAB results
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('scripts'); run_engine('fixtures/splines.json','results/matlab.json'); run_methods('fixtures/methods.json','results/methods/matlab.json')
      - name: Compare MATLAB with Python and independent reference
        run: |
          python scripts/verify.py --python-only --matlab-results results/matlab.json --require MATLAB
          python scripts/verify_methods.py --python-only --matlab-results results/methods/matlab.json --require MATLAB
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matlab-evidence
          path: results/
          if-no-files-found: error
